<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Radar</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2e3147;
      --accent: #4f8ef7;
      --accent2: #6c63ff;
      --prio1: #f59e0b;
      --prio2: #6366f1;
      --prio3: #6b7280;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header h1 span { color: var(--accent); }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3b7de8; }
    .btn-prio { background: var(--prio1); color: #000; }
    .btn-prio:hover:not(:disabled) { background: #d97706; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; border-radius: 6px; }

    /* MAIN LAYOUT */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 340px;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .filter-select {
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .filter-select:focus { border-color: var(--accent); }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      padding: 11px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      text-align: left;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: var(--text); }
    th.sort-active { color: var(--accent); }
    td {
      padding: 11px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    tr.selected td { background: rgba(79,142,247,.07); }

    .player-name {
      font-weight: 600;
      cursor: pointer;
    }
    .player-name:hover { color: var(--accent); }

    /* PRIO BADGE */
    .prio-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all .15s;
    }
    .prio-1 { background: rgba(245,158,11,.15); color: var(--prio1); border: 1px solid rgba(245,158,11,.3); }
    .prio-2 { background: rgba(99,102,241,.15); color: var(--prio2); border: 1px solid rgba(99,102,241,.3); }
    .prio-3 { background: rgba(107,114,128,.15); color: var(--prio3); border: 1px solid rgba(107,114,128,.3); }
    .prio-badge:hover { opacity: .8; }

    /* NEWS COUNT */
    .news-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
    }
    .news-count.has-news { background: rgba(16,185,129,.15); color: var(--green); }
    .news-count.no-news { background: var(--surface2); color: var(--muted); }

    /* TABLE ACTIONS */
    .row-actions {
      display: flex;
      gap: 6px;
    }

    /* STATS */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 120px;
    }
    .stat-card .label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .stat-card .value.prio1 { color: var(--prio1); }
    .stat-card .value.accent { color: var(--accent); }

    /* NEWS PANEL (DRAWER) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 100vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 101;
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: none; }
    .drawer-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .drawer-header-text { flex: 1; }
    .drawer-header h2 { font-size: 17px; font-weight: 700; }
    .drawer-header p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .drawer-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
    }

    /* NEWS ARTICLES */
    .news-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 0;
      color: var(--muted);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .news-empty {
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
    }
    .news-empty svg { opacity: .3; margin-bottom: 12px; }
    .news-empty p { font-size: 14px; }
    .news-empty .sub { font-size: 12px; margin-top: 4px; opacity: .7; }

    .article-list { display: flex; flex-direction: column; gap: 12px; }
    .article {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s;
      text-decoration: none;
      display: block;
    }
    .article:hover { border-color: var(--accent); }
    .article-source {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .article-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .article-meta {
      font-size: 11px;
      color: var(--muted);
    }

    /* ADD PLAYER MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: min(440px, calc(100vw - 32px));
      padding: 24px;
      transform: scale(.95);
      transition: transform .2s;
    }
    .modal-overlay.open .modal { transform: none; }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    /* BULK NEWS RESULTS */
    .bulk-section { margin-bottom: 24px; }
    .bulk-section h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      z-index: 300;
      transform: translateY(80px);
      opacity: 0;
      transition: all .25s;
      max-width: 300px;
    }
    .toast.show { transform: none; opacity: 1; }
    .toast.success { border-left: 3px solid var(--green); }
    .toast.error { border-left: 3px solid var(--red); }

    /* LOADING SKELETON */
    .skeleton {
      background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* TABS */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* FOOTIQUE BADGE */
    .footique-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(108,99,255,.4);
      background: rgba(108,99,255,.12);
      color: var(--accent2);
      transition: all .15s;
    }
    .footique-badge:hover { opacity: .75; }
    .footique-badge.inactive {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }

    /* SPIELPLAN / KALENDER */
    .spielplan-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .spielplan-month-nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .spielplan-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .spielplan-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px 4px 8px;
      border-radius: 20px;
    }
    .spielplan-legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .spielplan-month-nav h2 {
      font-size: 18px;
      font-weight: 700;
      min-width: 200px;
      text-align: center;
      letter-spacing: .3px;
    }

    /* DASHBOARD */
    .dashboard-header {
      margin-bottom: 24px;
    }
    .dashboard-header h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .dashboard-header p {
      font-size: 13px;
      color: var(--muted);
    }
    .dashboard-widgets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      align-items: start;
    }
    .dashboard-widget {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .dashboard-widget-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .dashboard-widget-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
      flex: 1;
    }
    .dashboard-widget-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 7px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .dashboard-widget-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .dashboard-widget-body::-webkit-scrollbar { width: 6px; }
    .dashboard-widget-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .dashboard-article-player {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px;
      color: var(--accent2);
      margin-bottom: 6px;
    }
    .dashboard-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 16px 0;
    }
    .today-content-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .today-content-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .today-content-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .today-content-time {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }
    .today-content-status {
      font-size: 11px;
      font-weight: 700;
      margin-left: auto;
    }
    .today-content-text {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .today-content-owner {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }
    @media (max-width: 768px) {
      .dashboard-widget-body { max-height: none; }
    }
    .spielplan-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      padding: 1px;
    }
    .spielplan-weekday {
      background: var(--surface2);
      padding: 8px 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      text-align: center;
    }
    .spielplan-day {
      background: var(--surface);
      min-height: 92px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spielplan-day.other-month { opacity: .35; }
    .spielplan-day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
    .spielplan-daynum {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }
    .spielplan-day.is-today .spielplan-daynum { color: var(--accent); }
    .spielplan-match {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 4px 6px;
      border-radius: 6px;
      background: var(--surface2);
      border-left: 3px solid var(--accent2);
      font-size: 10.5px;
      line-height: 1.35;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }
    .spielplan-match:hover { filter: brightness(1.25); }
    .spielplan-match.finished { opacity: .55; }
    .spielplan-match .m-player { font-weight: 700; }
    .spielplan-match .m-time { color: var(--muted); font-weight: 500; margin-left: 4px; }
    .spielplan-match .m-info { color: var(--muted); font-weight: 500; }
    .spielplan-match .m-tag {
      display: inline-block;
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .3px;
      padding: 1px 5px;
      border-radius: 8px;
      margin-right: 3px;
    }
    .spielplan-match .m-tag.home { background: rgba(16,185,129,.18); color: var(--green); }
    .spielplan-match .m-tag.away { background: rgba(99,102,241,.18); color: var(--prio2); }
    .spielplan-loading, .spielplan-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      background: var(--surface);
    }
    .spielplan-unmapped {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .spielplan-unmapped h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .spielplan-unmapped p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .spielplan-unmapped-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    .spielplan-unmapped-row:first-of-type { border-top: none; }
    .spielplan-unmapped-row .u-name { font-weight: 600; min-width: 160px; }
    .spielplan-unmapped-row .u-club { color: var(--muted); font-size: 12px; flex: 1; }

    @media (max-width: 768px) {
      .spielplan-day { min-height: 64px; }
      .spielplan-match { font-size: 9.5px; padding: 3px 4px; }
      .spielplan-match .m-info { display: none; }
      .spielplan-weekday { font-size: 9.5px; padding: 5px 2px; }
      .spielplan-unmapped-row { flex-wrap: wrap; }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      header { padding: 12px 16px; flex-direction: column; align-items: stretch; }
      header h1 { font-size: 17px; text-align: center; }
      .header-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .header-actions .btn { width: 100%; font-size: 12px; padding: 10px 8px; white-space: normal; }
      .tabs { padding: 0 16px; overflow-x: auto; }
      main { padding: 14px 12px; }
      .stats { gap: 8px; }
      .stat-card { min-width: 90px; padding: 10px 12px; flex: 1; }
      .stat-card .value { font-size: 18px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: none; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 760px; }
      .drawer { width: 100vw; }
      .modal { width: calc(100vw - 24px); padding: 18px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

let db = null, auth = null;

async function initFirebase() {
  if (firebaseConfig.apiKey === 'DEIN_API_KEY') {
    showToast('Firebase ist noch nicht konfiguriert (siehe FIREBASE_SETUP.md)', 'error');
    return;
  }
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const am = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');

    fsDoc = fs.doc; fsSetDoc = fs.setDoc; fsUpdateDoc = fs.updateDoc; fsDeleteDoc = fs.deleteDoc;
    fsGetDoc = fs.getDoc; fsCollection = fs.collection; fsOnSnapshot = fs.onSnapshot;
    fsSignInAnonymously = am.signInAnonymously;

    const app = initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    auth = am.getAuth(app);

    await fsSignInAnonymously(auth);
    await seedPlayersIfNeeded();
    subscribePlayers();
  } catch (err) {
    console.error(err);
    showToast('Verbindung zur Datenbank fehlgeschlagen: ' + err.message, 'error');
  }
}

async function seedPlayersIfNeeded() {
  const metaRef = fsDoc(db, 'meta', 'playersMeta');
  const metaSnap = await fsGetDoc(metaRef);
  if (metaSnap.exists()) return;
  for (const p of DEFAULT_PLAYERS) {
    const { id, ...rest } = p;
    await fsSetDoc(fsDoc(db, 'players', String(id)), rest);
  }
  await fsSetDoc(metaRef, { seeded: true, seededAt: Date.now() });
}

    }
  }, (err) => {

  });
}

// ─── NEWS CACHE (localStorage, 1h TTL) ───────────────────────────────────────
const NEWS_CACHE_KEY = 'news_cache';
const NEWS_CACHE_TTL = 60 * 60 * 1000; // 1 Stunde

function getCachedNews(playerId) {
  try {
    const raw = localStorage.getItem(NEWS_CACHE_KEY);
    if (!raw) return null;
    const cache = JSON.parse(raw);
    const entry = cache[playerId];
    if (!entry) return null;
    if (Date.now() - entry.ts > NEWS_CACHE_TTL) return null;
    return entry.articles;
  } catch { return null; }
}

function setCachedNews(playerId, articles) {
  try {
    const raw = localStorage.getItem(NEWS_CACHE_KEY);
    const cache = raw ? JSON.parse(raw) : {};
    cache[playerId] = { ts: Date.now(), articles };
    localStorage.setItem(NEWS_CACHE_KEY, JSON.stringify(cache));
  } catch {}
}

// ─── TABLE ───────────────────────────────────────────────────────────────────

function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = 1; }
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const pf = document.getElementById('prioFilter').value;
  const pof = document.getElementById('posFilter').value;

  let filtered = players.filter(p => {
    const name = (p.firstName + ' ' + p.lastName).toLowerCase();
    const matchQ = !q || name.includes(q) || (p.club||'').toLowerCase().includes(q);
    const matchP = !pf || p.prio == pf;
    const matchPo = !pof || p.pos === pof;
    const matchTab = activeTab === 'all' || p.footique;
    return matchQ && matchP && matchPo && matchTab;
  });

  filtered.sort((a, b) => {
    let av = a[sortKey] ?? '', bv = b[sortKey] ?? '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  // Update sort indicators
  ['name','pos','club','birth','nation','prio'].forEach(k => {
    const el = document.getElementById('sort-' + k);
    if (el) el.textContent = sortKey === k ? (sortDir === 1 ? ' ↑' : ' ↓') : '';
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {

// ─── PRIO CYCLE ──────────────────────────────────────────────────────────────

function cyclePrio(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  const newPrio = p.prio >= 3 ? 1 : p.prio + 1;
  fsUpdateDoc(fsDoc(db, 'players', String(id)), { prio: newPrio })
    .catch(err => showToast('Fehler: ' + err.message, 'error'));
}

// ─── DELETE ──────────────────────────────────────────────────────────────────

function deletePlayer(id) {
  const p = players.find(x => x.id === id);
  if (!confirm(`"${p.firstName} ${p.lastName}" wirklich löschen?`)) return;
  fsDeleteDoc(fsDoc(db, 'players', String(id)))
    .then(() => showToast('Spieler gelöscht', 'success'))
    .catch(err => showToast('Fehler: ' + err.message, 'error'));
}

// ─── NEWS ─────────────────────────────────────────────────────────────────────

async function fetchNews(player) {
  const query = player.searchTerm || [player.firstName, player.lastName].filter(Boolean).join(' ') + ' Fußball';
  // Eigene Serverless-Funktion (api/news.py) statt unzuverlässiger Gratis-Proxies
  const url = `/api/news?q=${encodeURIComponent(query)}`;

  let resp;
  try {
    resp = await fetch(url);
  } catch {
    throw new Error('News-Dienst nicht erreichbar.');
  }
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'Serverfehler');
  return data.articles || [];
}

async function openNewsDrawer(id) {
  const player = players.find(p => p.id === id);
  if (!player) return;
  const fullName = [player.firstName, player.lastName].filter(Boolean).join(' ');

  document.getElementById('drawerTitle').textContent = fullName;
  document.getElementById('drawerSubtitle').textContent = 'Letzte 7 Tage';
  const query = player.searchTerm || [player.firstName, player.lastName].filter(Boolean).join(' ') + ' Fußball';
  document.getElementById('drawerGoogleLink').href =
    `https://news.google.com/search?q=${encodeURIComponent(query)}&hl=de`;

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');

  // Show loading
  document.getElementById('drawerBody').innerHTML = `
    <div class="news-loading">
      <div class="spinner"></div>
      <p>News werden geladen…</p>
    </div>`;

  // Cache prüfen
  const cached = getCachedNews(id) || newsCache[id];
  if (cached) {
    newsCache[id] = cached;
    renderTable();
    renderDrawerArticles(cached, fullName);
    return;
  }

  try {
    const articles = await fetchNews(player);
    newsCache[id] = articles;
    setCachedNews(id, articles);
    renderTable();
    renderDrawerArticles(articles, fullName);
  } catch (e) {
    document.getElementById('drawerBody').innerHTML = `
      <div class="news-empty">
        <p>⚠️ Fehler beim Laden</p>
        <p class="sub">${e.message}</p>
      </div>`;
  }
}

function renderDrawerArticles(articles, name) {
  if (articles.length === 0) {
    document.getElementById('drawerBody').innerHTML = `
      <div class="news-empty">
        <p style="font-size:32px;margin-bottom:8px">📭</p>
        <p>Keine Artikel in den letzten 7 Tagen</p>
        <p class="sub">Versuche den Suchbegriff anzupassen</p>
      </div>`;
    return;
  }

  const html = articles.map(a => {
    const date = new Date(a.pubDate).toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });
    return `<a class="article" href="${a.link}" target="_blank" rel="noopener">
      <div class="article-source">${escHtml(a.source)}</div>
      <div class="article-title">${escHtml(a.title)}</div>
      <div class="article-meta">${date}</div>
    </a>`;
  }).join('');

  document.getElementById('drawerBody').innerHTML = `
    <div style="margin-bottom:10px;font-size:12px;color:var(--muted)">${articles.length} Artikel gefunden</div>
    <div class="article-list">${html}</div>`;
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// ─── SPIELPLAN (FIFA-KARRIEREMODUS-KALENDER) ─────────────────────────────────

const SPIELPLAN_CACHE_KEY = 'spielplan_cache_v2'; // v2: erzwingt Neuladen wegen FRIENDLY_MATCHES
const SPIELPLAN_CACHE_TTL = 6 * 60 * 60 * 1000; // 6 Stunden

const today = new Date();
let calendarYear = today.getFullYear();
let calendarMonth = today.getMonth(); // 0-basiert

const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WEEKDAYS = ['Mo','Di','Mi','Do','Fr','Sa','So'];

// Vorerst nur diese Spieler im Spielplan-Kalender (Testphase). Weitere Namen
// hier ergänzen, sobald der Rest der Footique-Spieler freigegeben wird.
// Namensbasiert (statt ID), da IDs sich beim Bearbeiten/Neuanlegen ändern können.
const SPIELPLAN_ENABLED_NAMES = [
  'linus güther',     // Union Berlin
  'malte brumm',      // Hertha BSC U17 (eigener manueller Spielplan)
];

// Feste Farbpalette für die individuelle Spieler-Einfärbung im Kalender.
// Zuordnung per Namens-Hash statt Index -> Reihenfolge/Anzahl der Spieler
// kann sich ändern, ohne dass Farben "verrutschen".
const SPIELPLAN_PALETTE = ['#f59e0b', '#06b6d4', '#ec4899', '#84cc16', '#a855f7', '#f97316', '#14b8a6', '#3b82f6'];

// Manuell festgelegte Vereinsfarben statt automatischer Hash-Zuweisung.
const PLAYER_COLOR_OVERRIDES = {
  'linus güther': '#E2001A',   // Union-Rot
  'malte brumm': '#005CA9',    // Hertha-Blau
};

function getPlayerColor(player) {
  const name = fullName(player);
  if (PLAYER_COLOR_OVERRIDES[name]) return PLAYER_COLOR_OVERRIDES[name];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  return SPIELPLAN_PALETTE[hash % SPIELPLAN_PALETTE.length];
}

function renderSpielplanLegend(playersList) {
  const el = document.getElementById('spielplanLegend');
  el.innerHTML = playersList.map(p => `
    <span class="spielplan-legend-item">
      <span class="spielplan-legend-dot" style="background:${getPlayerColor(p)}"></span>
      ${escHtml(p.firstName + ' ' + p.lastName)}
    </span>
  `).join('');
}

function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getSpielplanCache(key) {
  try {
    const raw = localStorage.getItem(SPIELPLAN_CACHE_KEY);
    if (!raw) return null;
    const cache = JSON.parse(raw);
    const entry = cache[key];
    if (!entry) return null;
    if (Date.now() - entry.ts > SPIELPLAN_CACHE_TTL) return null;
    return entry.matches;
  } catch { return null; }
}

function setSpielplanCache(key, matches) {
  try {
    const raw = localStorage.getItem(SPIELPLAN_CACHE_KEY);
    const cache = raw ? JSON.parse(raw) : {};
    cache[key] = { ts: Date.now(), matches };
    localStorage.setItem(SPIELPLAN_CACHE_KEY, JSON.stringify(cache));
  } catch {}
}

// Testspiele/Freundschaftsspiele stehen nicht bei openligadb (nur offizielle
// Wettbewerbe) - deshalb hier von Hand nachgetragen. Format je Verein: Datum,
// Uhrzeit, Heim-/Gastverein, ob der eigene Verein Heimrecht hat.
const FRIENDLY_MATCHES = {
  '1. FC Union Berlin': [
    { date: '2026-07-17', time: '19:00', home: 'FC Winterthur', away: '1. FC Union Berlin', isHome: false },
    { date: '2026-07-18', time: '16:00', home: 'FC Aarau', away: '1. FC Union Berlin', isHome: false },
    { date: '2026-08-01', time: '14:00', home: 'Dynamo Dresden', away: '1. FC Union Berlin', isHome: false },
    { date: '2026-08-02', time: '14:00', home: '1. FC Union Berlin', away: 'Cagliari Calcio', isHome: true },
    { date: '2026-08-15', time: '15:30', home: '1. FC Union Berlin', away: 'Ipswich Town', isHome: true },
  ],
  'Eintracht Frankfurt': [
    { date: '2026-07-18', time: '17:00', home: 'FC Gießen', away: 'Eintracht Frankfurt', isHome: false },
    { date: '2026-08-01', time: '17:00', home: 'Waldhof Mannheim', away: 'Eintracht Frankfurt', isHome: false },
    { date: '2026-08-15', time: '16:00', home: 'FC Brentford', away: 'Eintracht Frankfurt', isHome: false },
  ],
};

function getFriendlyMatches(club) {
  return (FRIENDLY_MATCHES[club] || []).map(m => ({
    date: m.date,
    time: m.time,
    competition: 'Testspiel',
    home: m.home,
    away: m.away,
    isHome: m.isHome,
    opponent: m.isHome ? m.away : m.home,
    finished: false,
  }));
}

// Für Spieler, deren eigene Jugend-Mannschaft nicht bei openligadb erfasst ist
// (z.B. U17-Teams): kompletter, von Hand gepflegter Spielplan statt Vereins-API.
// Ersetzt die API-Abfrage komplett (kein Mischen mit Profi-Spielen des Klubs).
const MANUAL_MATCHES = {
  'malte brumm': [
    { date: '2026-07-29', time: '16:30', competition: 'Freundschaftsspiel', home: 'Hertha BSC U17', away: 'SC Staaken 1919 U19', isHome: true },
    { date: '2026-08-02', time: '11:00', competition: 'Freundschaftsspiel', home: 'Hertha BSC U17', away: 'Viktoria Berlin (U17)', isHome: true },
    { date: '2026-08-09', time: '11:00', competition: 'U17 Bundesliga', home: 'Hertha BSC', away: 'VfL Wolfsburg', isHome: true },
    { date: '2026-08-15', time: '11:00', competition: 'U17 Bundesliga', home: 'Eimsbütteler TV', away: 'Hertha BSC', isHome: false },
    { date: '2026-08-23', time: '11:00', competition: 'U17 Bundesliga', home: 'Hertha BSC', away: 'Holstein Kiel', isHome: true },
    { date: '2026-08-30', time: '11:00', competition: 'U17 Bundesliga', home: 'Hamburger SV', away: 'Hertha BSC', isHome: false },
  ],
};

function getManualMatches(playerName) {
  const list = MANUAL_MATCHES[playerName.trim().toLowerCase()];
  if (!list) return null;
  return list.map(m => ({
    date: m.date,
    time: m.time,
    competition: m.competition,
    home: m.home,
    away: m.away,
    isHome: m.isHome,
    opponent: m.isHome ? m.away : m.home,
    finished: false,
  }));
}

async function fetchPlayerMatches(player, force) {
  const cacheKey = String(player.id);
  if (!force) {
    const cached = getSpielplanCache(cacheKey);
    if (cached) return cached;
  }

  const manual = getManualMatches(fullName(player));
  if (manual) {
    setSpielplanCache(cacheKey, manual);
    return manual;
  }

  const url = `/api/spielplan?club=${encodeURIComponent(player.openligaClub)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'Serverfehler');
  const matches = [...(data.matches || []), ...getFriendlyMatches(player.openligaClub)];
  matches.sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  setSpielplanCache(cacheKey, matches);
  return matches;
}

function shiftMonth(delta) {
  calendarMonth += delta;
  if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
  if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
  renderSpielplanCalendar();
}

let spielplanMatchesByPlayerId = {};

async function loadSpielplan(force) {
  const enabled = players.filter(p => p.footique && SPIELPLAN_ENABLED_NAMES.includes(fullName(p)));
  const mapped = enabled.filter(p => p.openligaClub || MANUAL_MATCHES[fullName(p)]);
  const unmapped = enabled.filter(p => !p.openligaClub && !MANUAL_MATCHES[fullName(p)]);

  document.getElementById('spielplanGrid').innerHTML = `
    <div class="spielplan-loading">
      <div class="spinner" style="margin:0 auto 12px"></div>
      Spielpläne werden geladen…
    </div>`;

  const results = await Promise.allSettled(mapped.map(async p => {
    const matches = await fetchPlayerMatches(p, force);
    return { player: p, matches };
  }));

  spielplanMatchesByPlayerId = {};
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      spielplanMatchesByPlayerId[r.value.player.id] = r.value.matches;
    }
  });

  renderSpielplanLegend(mapped);
  renderSpielplanCalendar();
  renderSpielplanUnmapped(unmapped);
}

function renderSpielplanUnmapped(unmapped) {
  const el = document.getElementById('spielplanUnmapped');
  if (unmapped.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <h3>⚠️ Noch keinem Team zugeordnet</h3>
    <p>Für diese Footique-Spieler fehlt der Vereinsname für den Spielplan-Kalender. Über "✏️ Bearbeiten" im Tab "Footique-Spieler" könnt ihr ihn ergänzen (Feld "Vereinsname für Spielplan-Kalender").</p>
    ${unmapped.map(p => `
      <div class="spielplan-unmapped-row">
        <span class="u-name">${escHtml(p.firstName + ' ' + p.lastName)}</span>
        <span class="u-club">${escHtml(p.club || '—')} · Jg. ${p.birth || '—'}</span>
      </div>
    `).join('')}
  `;
}

function renderSpielplanCalendar() {
  document.getElementById('spielplanMonthLabel').textContent = `${MONTH_NAMES[calendarMonth]} ${calendarYear}`;

  // Alle Matches im aktuellen Monat einsammeln, gruppiert nach Tag (YYYY-MM-DD)
  const matchesByDay = {};
  for (const [playerId, matches] of Object.entries(spielplanMatchesByPlayerId)) {
    const player = players.find(p => p.id == playerId);
    if (!player) continue;
    for (const m of matches) {
      if (!m.date) continue;
      const [y, mo] = m.date.split('-').map(Number);
      if (y !== calendarYear || (mo - 1) !== calendarMonth) continue;
      if (!matchesByDay[m.date]) matchesByDay[m.date] = [];
      matchesByDay[m.date].push({ player, match: m });
    }
  }

  const firstOfMonth = new Date(calendarYear, calendarMonth, 1);
  // Montag = 0 ... Sonntag = 6
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
  const gridStart = new Date(calendarYear, calendarMonth, 1 - startOffset);

  const todayStr = localDateStr(new Date());
  const cellCount = Math.ceil((startOffset + daysInMonth) / 7) * 7;

  let html = WEEKDAYS.map(d => `<div class="spielplan-weekday">${d}</div>`).join('');

  for (let i = 0; i < cellCount; i++) {
    const cellDate = new Date(gridStart);
    cellDate.setDate(gridStart.getDate() + i);
    const dateStr = localDateStr(cellDate);
    const inMonth = cellDate.getMonth() === calendarMonth;
    const dayMatches = matchesByDay[dateStr] || [];

    html += `<div class="spielplan-day ${inMonth ? '' : 'other-month'} ${dateStr === todayStr ? 'is-today' : ''}">
      <div class="spielplan-daynum">${cellDate.getDate()}</div>
      ${dayMatches.map(({ player, match }) => `
        <div class="spielplan-match ${match.finished ? 'finished' : ''}" style="border-left-color:${getPlayerColor(player)}" title="${escHtml(player.firstName + ' ' + player.lastName)} · ${escHtml(match.competition || '')}${match.time ? ' · ' + match.time + ' Uhr' : ''}">
          <span><span class="m-tag ${match.isHome ? 'home' : 'away'}">${match.isHome ? 'Heim' : 'Ausw.'}</span><span class="m-player">${escHtml(player.firstName + ' ' + player.lastName.slice(0,1) + '.')}</span>${match.time ? `<span class="m-time">${match.time}</span>` : ''}</span>
          <span class="m-info">vs ${escHtml(match.opponent)}</span>
        </div>
      `).join('')}
    </div>`;
  }

  const grid = document.getElementById('spielplanGrid');
  grid.innerHTML = html;

  const totalMatches = Object.values(matchesByDay).reduce((sum, arr) => sum + arr.length, 0);
  if (totalMatches === 0 && Object.keys(spielplanMatchesByPlayerId).length > 0) {
    grid.innerHTML += `<div class="spielplan-empty">Keine Spiele der Footique-Talente in diesem Monat gefunden.</div>`;
  }
}

const GENERAL_NEWS_QUERY = '(Nachwuchsfußball OR "A-Jugend Bundesliga" OR "B-Jugend Bundesliga" OR "DFB-Nachwuchs" OR Nachwuchsleistungszentrum)';
const GENERAL_NEWS_CACHE_KEY = 'general_news_cache';
const GENERAL_NEWS_CACHE_TTL = 60 * 60 * 1000; // 1 Stunde

function getCachedGeneralNews() {
  try {
    const raw = localStorage.getItem(GENERAL_NEWS_CACHE_KEY);
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (Date.now() - entry.ts > GENERAL_NEWS_CACHE_TTL) return null;
    return entry.articles;
  } catch { return null; }
}

function setCachedGeneralNews(articles) {
  try {
    localStorage.setItem(GENERAL_NEWS_CACHE_KEY, JSON.stringify({ ts: Date.now(), articles }));
  } catch {}
}

async function fetchGeneralNews() {
  const cached = getCachedGeneralNews();
  if (cached) return cached;
  const url = `/api/news?q=${encodeURIComponent(GENERAL_NEWS_QUERY)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || 'Serverfehler');
  const articles = data.articles || [];
  setCachedGeneralNews(articles);
  return articles;
}

function renderDashboardDate() {
  document.getElementById('dashboardDate').textContent =
    new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

function dashboardArticleCard(a, playerName) {
  const date = new Date(a.pubDate).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
  return `<a class="article" href="${a.link}" target="_blank" rel="noopener">
    ${playerName ? `<div class="dashboard-article-player">⭐ ${escHtml(playerName)}</div>` : ''}
    <div class="article-source">${escHtml(a.source)}</div>
    <div class="article-title">${escHtml(a.title)}</div>
    <div class="article-meta">${date}</div>
  </a>`;
}

async function loadDashboard() {
  renderDashboardDate();
  loadDashboardTopNews();
  loadDashboardGeneralNews();
}

async function loadDashboardTopNews() {
  const el = document.getElementById('dashboardTopNews');
  const countEl = document.getElementById('dashboardTopNewsCount');
  const topPlayers = players.filter(p => p.prio === 1);
  if (topPlayers.length === 0) {
    countEl.textContent = '0';
    el.innerHTML = `<div class="dashboard-empty">Keine Prio-1-Spieler vorhanden</div>`;
    return;
  }
  el.innerHTML = `<div class="dashboard-empty">Wird geladen…</div>`;

  const results = await Promise.allSettled(topPlayers.map(async p => {
    const cached = getCachedNews(p.id) || newsCache[p.id];
    const articles = cached || await fetchNews(p);
    newsCache[p.id] = articles;
    setCachedNews(p.id, articles);
    return { player: p, articles };
  }));

  const cards = [];
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      const name = [r.value.player.firstName, r.value.player.lastName].filter(Boolean).join(' ');
      r.value.articles.forEach(a => cards.push({ a, name, ts: a.timestamp || 0 }));
    }
  });
  cards.sort((x, y) => y.ts - x.ts);
  countEl.textContent = cards.length;

  el.innerHTML = cards.length === 0
    ? `<div class="dashboard-empty">Keine aktuellen News zu deinen Top-Talenten</div>`
    : cards.slice(0, 12).map(c => dashboardArticleCard(c.a, c.name)).join('');
}

async function loadDashboardGeneralNews() {
  const el = document.getElementById('dashboardGeneralNews');
  const countEl = document.getElementById('dashboardGeneralNewsCount');
  el.innerHTML = `<div class="dashboard-empty">Wird geladen…</div>`;
  try {
    const articles = await fetchGeneralNews();
    countEl.textContent = articles.length;
    el.innerHTML = articles.length === 0
      ? `<div class="dashboard-empty">Keine allgemeinen News gefunden</div>`
      : articles.slice(0, 12).map(a => dashboardArticleCard(a, null)).join('');
  } catch (e) {
    countEl.textContent = '!';
    el.innerHTML = `<div class="dashboard-empty">Fehler beim Laden: ${escHtml(e.message)}</div>`;
  }
}

// ─── BULK NEWS ───────────────────────────────────────────────────────────────

async function loadBulkNews(prio) {
  const labels = { 1: '⭐ Prio-1', 2: '🔵 Prio-2', 3: '⚫ Prio-3' };
  const group = players.filter(p => p.prio === prio);
  if (group.length === 0) { showToast(`Keine Prio-${prio} Spieler vorhanden`, 'error'); return; }

  document.getElementById('drawerTitle').textContent = `${labels[prio]} News`;
  document.getElementById('drawerSubtitle').textContent = `${group.length} Spieler · Letzte 7 Tage`;
  document.getElementById('drawerGoogleLink').style.display = 'none';
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBody').innerHTML = `
    <div class="news-loading">
      <div class="spinner"></div>
      <p>Lade News für ${group.length} Spieler…</p>
    </div>`;

  const results = await Promise.allSettled(group.map(async p => {
    const cached = getCachedNews(p.id) || newsCache[p.id];
    if (cached) {
      newsCache[p.id] = cached;
      return { player: p, articles: cached };
    }
    const articles = await fetchNews(p);
    newsCache[p.id] = articles;
    setCachedNews(p.id, articles);
    return { player: p, articles };
  }));

  renderTable();

  const sections = results
    .filter(r => r.status === 'fulfilled' && r.value.articles.length > 0)
    .map(r => {
      const { player, articles } = r.value;
      const fullName = [player.firstName, player.lastName].filter(Boolean).join(' ');
      const artHtml = articles.map(a => {
        const date = new Date(a.pubDate).toLocaleDateString('de-DE', { day: '2-digit', month: 'short' });
        return `<a class="article" href="${a.link}" target="_blank" rel="noopener">
          <div class="article-source">${escHtml(a.source)}</div>
          <div class="article-title">${escHtml(a.title)}</div>
          <div class="article-meta">${date}</div>
        </a>`;
      }).join('');
      return `<div class="bulk-section">
        <h3>${escHtml(fullName)} <span style="color:var(--muted);font-weight:400">(${articles.length})</span></h3>
        <div class="article-list">${artHtml}</div>
      </div>`;
    }).join('');

  document.getElementById('drawerBody').innerHTML = sections || `
    <div class="news-empty">
      <p style="font-size:32px;margin-bottom:8px">📭</p>
      <p>Keine ${labels[prio]} News in den letzten 7 Tagen</p>
    </div>`;
  document.getElementById('drawerGoogleLink').style.display = '';
}

// ─── ADD / EDIT MODAL ────────────────────────────────────────────────────────

function openAddModal() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Spieler hinzufügen';
  ['fFirstName','fLastName','fClub','fNation','fSearch','fFbClub'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fPos').value = '';
  document.getElementById('fPrio').value = '1';
  document.getElementById('fBirth').value = '';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('fFirstName').focus();
}

function openEditModal(id) {
  const p = players.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('modalTitle').textContent = 'Spieler bearbeiten';
  document.getElementById('fFirstName').value = p.firstName;
  document.getElementById('fLastName').value = p.lastName;
  document.getElementById('fPos').value = p.pos || '';
  document.getElementById('fBirth').value = p.birth || '';
  document.getElementById('fClub').value = p.club || '';
  document.getElementById('fNation').value = p.nation || '';
  document.getElementById('fPrio').value = p.prio;
  document.getElementById('fSearch').value = p.searchTerm || '';
  document.getElementById('fFbClub').value = p.openligaClub || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function savePlayer() {
  const firstName = document.getElementById('fFirstName').value.trim();
  const lastName  = document.getElementById('fLastName').value.trim();
  if (!firstName) { showToast('Vorname ist Pflichtfeld', 'error'); return; }

  const data = {
    firstName,
    lastName,
    pos:        document.getElementById('fPos').value,
    birth:      parseInt(document.getElementById('fBirth').value) || null,
    club:       document.getElementById('fClub').value.trim(),
    nation:     document.getElementById('fNation').value.trim(),
    prio:       parseInt(document.getElementById('fPrio').value),
    searchTerm: document.getElementById('fSearch').value.trim(),
    openligaClub: document.getElementById('fFbClub').value.trim(),
  };

  if (editId) {
    delete newsCache[editId]; // Invalidate cache
    delete spielplanMatchesByPlayerId[editId]; // Invalidate Spielplan-Cache
    try {
      const raw = localStorage.getItem(SPIELPLAN_CACHE_KEY);
      if (raw) {
        const cache = JSON.parse(raw);
        delete cache[String(editId)];
        localStorage.setItem(SPIELPLAN_CACHE_KEY, JSON.stringify(cache));
      }
    } catch {}
    fsUpdateDoc(fsDoc(db, 'players', String(editId)), data)
      .then(() => showToast('Spieler aktualisiert', 'success'))
      .catch(err => showToast('Fehler: ' + err.message, 'error'));
  } else {
    const newId = Date.now();
    fsSetDoc(fsDoc(db, 'players', String(newId)), { ...data, footique: false })
      .then(() => showToast('Spieler hinzugefügt', 'success'))
      .catch(err => showToast('Fehler: ' + err.message, 'error'));
  }

  closeModal();
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────────────

function exportPlayers() {
  const json = JSON.stringify(players, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `news-radar-spieler-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${players.length} Spieler exportiert`, 'success');
}

function importPlayers(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Ungültiges Format');
      for (const p of imported) {
        const { id, ...rest } = p;
        await fsSetDoc(fsDoc(db, 'players', String(id)), rest);
      }
      showToast(`${imported.length} Spieler importiert`, 'success');
    } catch (err) {
      showToast('Import fehlgeschlagen: ' + err.message, 'error');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeModal(); }
});

// ─── INIT ────────────────────────────────────────────────────────────────────

renderDashboardDate();
loadDashboardGeneralNews();
initWochenplanRead();
renderStats();
renderTable();
</script>
